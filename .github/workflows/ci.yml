name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Verificar que nenhuma chave de API entra no bundle do cliente
        run: |
          if grep -rE "PADEL_API_TOKEN" .next/static 2>/dev/null; then
            echo "Chave de API encontrada no bundle do cliente!"
            exit 1
          fi
